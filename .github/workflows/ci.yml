name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-dummy-secret-not-used-for-anything
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm check
      - run: pnpm build

  images:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushes only if both images build, so a deploy never mixes old and new.
      - uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          push: true
          provenance: false
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          LATEST: "true"

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the compose file is needed, to check the server's copy is this commit's.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: compose.prod.yaml
          sparse-checkout-cone-mode: false
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$TARGET" "sha-${GITHUB_SHA::7}" < compose.prod.yaml
      - name: Health check
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 "${{ vars.SITE_URL }}/api/health"
